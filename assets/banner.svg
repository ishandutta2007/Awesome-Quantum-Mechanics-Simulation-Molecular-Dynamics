<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="45%" stop-color="#0d1530" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>

    <linearGradient id="atomGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="atomGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <linearGradient id="atomGlow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-grid {
      stroke: rgba(79, 172, 254, 0.07);
      stroke-width: 1;
    }
    .orbit {
      fill: none;
      stroke-width: 1.5;
      opacity: 0.45;
      transform-origin: 1020px 170px;
    }
    .orbit-1 {
      stroke: #00f2fe;
      stroke-dasharray: 6, 8;
      animation: rotateOrbit1 24s linear infinite;
    }
    .orbit-2 {
      stroke: #a18cd1;
      stroke-dasharray: 8, 10;
      animation: rotateOrbit2 18s linear infinite reverse;
    }
    .orbit-3 {
      stroke: #38ef7d;
      stroke-dasharray: 5, 7;
      animation: rotateOrbit3 30s linear infinite;
    }
    .wave-line {
      fill: none;
      stroke-linecap: round;
      opacity: 0.22;
      animation: pulseWave 6s ease-in-out infinite alternate;
    }
    .floating-particle {
      animation: floatNode 4s ease-in-out infinite alternate;
    }
    .pulse-core {
      animation: coreGlow 3s ease-in-out infinite alternate;
    }
    .tag-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
    }

    @keyframes rotateOrbit1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateOrbit2 {
      from { transform: rotate(45deg); }
      to { transform: rotate(405deg); }
    }
    @keyframes rotateOrbit3 {
      from { transform: rotate(110deg); }
      to { transform: rotate(470deg); }
    }
    @keyframes coreGlow {
      0% { r: 18; opacity: 0.85; filter: drop-shadow(0 0 6px #00f2fe); }
      100% { r: 22; opacity: 1; filter: drop-shadow(0 0 16px #4facfe); }
    }
    @keyframes pulseWave {
      0% { transform: translateY(0px) scaleY(1); }
      100% { transform: translateY(-8px) scaleY(1.08); }
    }
    @keyframes floatNode {
      0% { transform: translate(0, 0); }
      50% { transform: translate(4px, -6px); }
      100% { transform: translate(-3px, 4px); }
    }
  </style>

  <!-- Deep Sci-Fi Canvas Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" />

  <!-- Background Quantum Grid -->
  <g class="bg-grid">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="80" y1="0" x2="80" y2="340" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="320" y1="0" x2="320" y2="340" />
    <line x1="440" y1="0" x2="440" y2="340" />
    <line x1="560" y1="0" x2="560" y2="340" />
    <line x1="680" y1="0" x2="680" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="920" y1="0" x2="920" y2="340" />
    <line x1="1040" y1="0" x2="1040" y2="340" />
    <line x1="1160" y1="0" x2="1160" y2="340" />
  </g>

  <!-- Ambient Wavefront Simulation (Schrödinger Wavepacket) in Background -->
  <g>
    <path class="wave-line" stroke="#00f2fe" stroke-width="2" d="M -50 250 C 120 180, 240 310, 420 230 C 600 150, 780 290, 960 210 C 1080 160, 1180 240, 1250 220" />
    <path class="wave-line" stroke="#7f00ff" stroke-width="2" d="M -50 280 C 150 220, 300 330, 480 260 C 660 190, 840 320, 1020 240 C 1120 200, 1200 270, 1250 260" />
  </g>

  <!-- Dynamic Molecular / Atomic Orbital System (Right Stage) -->
  <!-- Center at (1020, 170) -->
  <g>
    <!-- Atomic Orbits -->
    <ellipse cx="1020" cy="170" rx="125" ry="46" class="orbit orbit-1" />
    <ellipse cx="1020" cy="170" rx="125" ry="46" class="orbit orbit-2" />
    <ellipse cx="1020" cy="170" rx="125" ry="46" class="orbit orbit-3" />

    <!-- Quantum Core Nucleus -->
    <circle cx="1020" cy="170" r="28" fill="#00f2fe" opacity="0.25" filter="url(#glowHeavy)" />
    <circle cx="1020" cy="170" r="18" fill="url(#primaryGlow)" class="pulse-core" />
    <circle cx="1020" cy="170" r="8" fill="#ffffff" opacity="0.9" />

    <!-- Orbital Electrons / Atoms -->
    <g class="orbit orbit-1">
      <circle cx="1145" cy="170" r="7" fill="url(#atomGlow1)" filter="url(#glow)" />
      <circle cx="895" cy="170" r="5" fill="#38ef7d" opacity="0.8" />
    </g>

    <g class="orbit orbit-2">
      <circle cx="1145" cy="170" r="8" fill="url(#atomGlow2)" filter="url(#glow)" />
      <circle cx="895" cy="170" r="6" fill="#ff7675" opacity="0.8" />
    </g>

    <g class="orbit orbit-3">
      <circle cx="1145" cy="170" r="7.5" fill="url(#atomGlow3)" filter="url(#glow)" />
      <circle cx="895" cy="170" r="5.5" fill="#00f2fe" opacity="0.8" />
    </g>

    <!-- Molecular Bond Network Satellites -->
    <line x1="1020" y1="170" x2="880" y2="75" stroke="#4facfe" stroke-width="1.8" stroke-dasharray="3, 4" opacity="0.5" />
    <circle cx="880" cy="75" r="9" fill="url(#atomGlow1)" filter="url(#glow)" class="floating-particle" />
    <text x="880" y="78" fill="#ffffff" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">H</text>

    <line x1="1020" y1="170" x2="860" y2="255" stroke="#7f00ff" stroke-width="1.8" stroke-dasharray="3, 4" opacity="0.5" />
    <circle cx="860" cy="255" r="11" fill="url(#atomGlow2)" filter="url(#glow)" class="floating-particle" />
    <text x="860" y="259" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">O</text>

    <line x1="1020" y1="170" x2="1140" y2="70" stroke="#00f2fe" stroke-width="1.8" stroke-dasharray="3, 4" opacity="0.5" />
    <circle cx="1140" cy="70" r="10" fill="url(#primaryGlow)" filter="url(#glow)" class="floating-particle" />
    <text x="1140" y="74" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">C</text>
  </g>

  <!-- Foreground Content (Always prominent, never obscured) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 48)">
      <rect width="250" height="26" rx="13" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1" />
      <circle cx="15" cy="13" r="4" fill="#00f2fe">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="17" fill="#00f2fe" class="tag-pill">QUANTUM &amp; ATOMISTIC SIMULATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5px">
      Quantum Mechanics Simulation
    </text>
    <text x="0" y="165" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5px">
      &amp; Molecular Dynamics
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="206" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
      Enterprise SaaS Platforms • Ab Initio DFT • Machine Learning Potentials • High-Performance MD
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 235)">
      <!-- Pill 1: DFT & Wavefunction -->
      <g transform="translate(0, 0)">
        <rect width="130" height="28" rx="6" fill="#131c38" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#00f2fe" />
        <text x="25" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">DFT &amp; Ab Initio</text>
      </g>

      <!-- Pill 2: Molecular Dynamics -->
      <g transform="translate(140, 0)">
        <rect width="130" height="28" rx="6" fill="#131c38" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#38ef7d" />
        <text x="25" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Massive Scale MD</text>
      </g>

      <!-- Pill 3: Equivariant ML Potentials -->
      <g transform="translate(280, 0)">
        <rect width="145" height="28" rx="6" fill="#131c38" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#f857a6" />
        <text x="25" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">ML Force Fields</text>
      </g>

      <!-- Pill 4: Cloud & 3D WebGL -->
      <g transform="translate(435, 0)">
        <rect width="140" height="28" rx="6" fill="#131c38" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#a18cd1" />
        <text x="25" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">WebGL &amp; Cloud HPC</text>
      </g>
    </g>

    <!-- Bottom Metadata Tagline -->
    <g transform="translate(0, 290)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="11.5" font-weight="500">
        Curated with precision for Computational Chemists, Physicists, and Biomolecular Engineers
      </text>
    </g>
  </g>
</svg>
